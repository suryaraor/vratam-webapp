<!doctype html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Vratam Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f4f1;
    --card: #ffffff;
    --ink: #232019;
    --ink-soft: #6b6459;
    --accent: #b5651d;
    --accent-ink: #ffffff;
    --border: #e6e1d8;
    --good: #3a7d44;
    --bad: #b5312f;
    --shadow: 0 2px 10px rgba(35,32,25,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', 'Noto Sans Telugu', system-ui, sans-serif;
    min-height: 100vh;
    padding-bottom: 84px;
  }
  header {
    background: var(--accent);
    color: var(--accent-ink);
    padding: 18px 20px 16px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 0.8rem; opacity: 0.9; }

  main { max-width: 560px; margin: 0 auto; padding: 16px; }

  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 18px;
    margin-bottom: 14px;
  }

  label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-soft); margin: 14px 0 6px; }
  label:first-child { margin-top: 0; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
  }
  textarea { min-height: 80px; resize: vertical; font-family: 'Noto Sans Telugu', 'Inter', sans-serif; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button {
    font: inherit;
    font-weight: 700;
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); width: 100%; font-size: 1.02rem; margin-top: 18px; }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .btn-ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }

  .toast {
    position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: var(--good); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 0.88rem; font-weight: 600; box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--bad); }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: #fff; border-top: 1px solid var(--border);
    box-shadow: 0 -2px 10px rgba(35,32,25,0.06);
  }
  nav.tabs button {
    flex: 1; background: none; border-radius: 0; padding: 14px 8px;
    color: var(--ink-soft); font-size: 0.85rem; font-weight: 600;
  }
  nav.tabs button.active { color: var(--accent); }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Puja execute screen */
  .progress { font-size: 0.85rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; text-align: center; }
  .puja-card {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    padding: 28px 22px; text-align: center; min-height: 220px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .puja-number { font-size: 0.85rem; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
  .puja-gotram { font-family: 'Noto Sans Telugu', sans-serif; font-size: 1.15rem; font-weight: 700; color: var(--accent); margin-bottom: 10px; }
  .puja-text { font-family: 'Noto Sans Telugu', sans-serif; font-size: 1.3rem; line-height: 1.55; }
  .empty-state { text-align: center; padding: 50px 10px; color: var(--ink-soft); }
  .empty-state .emoji { font-size: 2.6rem; margin-bottom: 10px; }

  .complete-btn { background: var(--good); color: #fff; width: 100%; font-size: 1.1rem; padding: 18px; margin-top: 18px; }
  .complete-btn:disabled { opacity: 0.5; }

  /* List screen */
  .list-row {
    background: var(--card); border-radius: 12px; box-shadow: var(--shadow);
    padding: 12px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .list-row.cancelled { opacity: 0.55; }
  .list-row-id { font-size: 0.72rem; color: var(--ink-soft); font-weight: 700; min-width: 28px; }
  .list-row-main { flex: 1; min-width: 0; }
  .list-row-gotram { font-family: 'Noto Sans Telugu', sans-serif; font-weight: 700; color: var(--accent); font-size: 0.92rem; }
  .list-row-text { font-family: 'Noto Sans Telugu', sans-serif; font-size: 0.85rem; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .badge-annual { background: #fdeee0; color: var(--accent); }
  .badge-onetime { background: #eef0ec; color: var(--ink-soft); }
  .badge-cancelled { background: #f6e3e2; color: var(--bad); }
  .list-search { margin-bottom: 12px; }
  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .btn-danger { background: var(--bad); color: #fff; }
  .btn-danger.confirming { background: #7a1f1e; }
  .btn-back { background: none; color: var(--accent); font-size: 0.85rem; padding: 6px 0; margin-bottom: 8px; }

  .history-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 2px; border-bottom: 1px solid var(--border); font-size: 0.9rem;
  }
  .history-row:last-child { border-bottom: none; }
  .history-done { color: var(--good); font-weight: 700; }
  .history-pending { color: var(--ink-soft); }
  .history-empty { color: var(--ink-soft); font-size: 0.85rem; padding: 8px 2px; }

  #pinOverlay {
    position: fixed; inset: 0; background: rgba(35,32,25,0.55);
    display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  #pinOverlay .card { max-width: 320px; width: 100%; margin: 0; text-align: center; }
  #pinOverlay p { color: var(--ink-soft); font-size: 0.85rem; margin-top: 0; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>శ్రీ సత్యనారాయణ వ్రతం</h1>
  <p>Vratam Manager</p>
</header>

<main>

  <section id="screen-add" class="screen active">
    <div class="card">
      <label for="f-fullText">Full Text (sankalpa text)</label>
      <textarea id="f-fullText" placeholder="గోత్రం... పేర్లు..."></textarea>

      <label for="f-gotram">Gotram</label>
      <input id="f-gotram" type="text" placeholder="e.g. హరితస">

      <div class="row2">
        <div>
          <label for="f-headName">Head Name (optional)</label>
          <input id="f-headName" type="text">
        </div>
        <div>
          <label for="f-phone">Phone (optional)</label>
          <input id="f-phone" type="tel">
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="f-membershipType">Membership</label>
          <select id="f-membershipType">
            <option value="One-Time">One-Time</option>
            <option value="Annual">Annual (12 months)</option>
          </select>
        </div>
        <div>
          <label for="f-startMonth">Start Month</label>
          <input id="f-startMonth" type="month">
        </div>
      </div>

      <div class="row2">
        <div>
          <label for="f-amountPaid">Amount Paid</label>
          <input id="f-amountPaid" type="number" inputmode="numeric" placeholder="500">
        </div>
        <div>
          <label for="f-pujaType">Puja Type</label>
          <select id="f-pujaType">
            <option value="సంకల్ప">సంకల్ప (Sankalpa)</option>
            <option value="ప్రత్యక్ష">ప్రత్యక్ష (In-person)</option>
          </select>
        </div>
      </div>

      <button class="btn-primary" id="btn-add">Add Entry</button>
    </div>
  </section>

  <section id="screen-puja" class="screen">
    <div class="card">
      <label for="p-month">Month</label>
      <input id="p-month" type="month">
      <button class="btn-ghost" id="btn-loadPuja" style="width:100%; margin-top:12px;">Load Scheduled Pujas</button>
    </div>

    <div id="puja-progress" class="progress hidden"></div>
    <div id="puja-area"></div>
  </section>

  <section id="screen-list" class="screen">
    <div id="list-browse">
      <div class="row2">
        <input id="list-month" type="month">
        <input id="list-search" type="text" placeholder="Search gotram, name, #id...">
      </div>
      <button class="btn-ghost" id="btn-copyList" style="width:100%; margin: 12px 0;">📋 Copy List for WhatsApp</button>
      <div id="list-count" class="progress"></div>
      <div id="list-rows"></div>
    </div>

    <div id="list-edit" class="hidden">
      <button class="btn-back" id="btn-backToList">&larr; Back to list</button>
      <div class="card">
        <label for="e-fullText">Full Text (sankalpa text)</label>
        <textarea id="e-fullText"></textarea>

        <label for="e-gotram">Gotram</label>
        <input id="e-gotram" type="text">

        <div class="row2">
          <div>
            <label for="e-headName">Head Name (optional)</label>
            <input id="e-headName" type="text">
          </div>
          <div>
            <label for="e-phone">Phone (optional)</label>
            <input id="e-phone" type="tel">
          </div>
        </div>

        <div class="row2">
          <div>
            <label for="e-membershipType">Membership</label>
            <select id="e-membershipType">
              <option value="One-Time">One-Time</option>
              <option value="Annual">Annual (12 months)</option>
            </select>
          </div>
          <div>
            <label for="e-startMonth">Start Month</label>
            <input id="e-startMonth" type="month">
          </div>
        </div>

        <div class="row2">
          <div>
            <label for="e-amountPaid">Amount Paid</label>
            <input id="e-amountPaid" type="number" inputmode="numeric">
          </div>
          <div>
            <label for="e-pujaType">Puja Type</label>
            <select id="e-pujaType">
              <option value="సంకల్ప">సంకల్ప (Sankalpa)</option>
              <option value="ప్రత్యక్ష">ప్రత్యక్ష (In-person)</option>
            </select>
          </div>
        </div>

        <label for="e-status">Status</label>
        <select id="e-status">
          <option value="Active">Active</option>
          <option value="Cancelled">Cancelled</option>
        </select>

        <div class="btn-row">
          <button class="btn-danger" id="btn-delete">Delete</button>
          <button class="btn-primary" id="btn-save" style="margin-top:0;">Save Changes</button>
        </div>
      </div>

      <div class="card">
        <label style="margin-top:0;">Puja History</label>
        <div id="e-history"></div>
      </div>
    </div>
  </section>

</main>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <button id="tab-add" class="active">➕ Add Entry</button>
  <button id="tab-puja">🪔 Execute Puja</button>
  <button id="tab-list">📋 List</button>
</nav>

<div id="pinOverlay">
  <div class="card">
    <h2 style="margin-top:0;">Enter Access PIN</h2>
    <p>Ask the committee admin if you don't have it.</p>
    <input id="pinInput" type="password" autocapitalize="none" autocomplete="off" placeholder="PIN">
    <button class="btn-primary" id="pinSubmit">Continue</button>
  </div>
</div>

<script>
// ---- Config ----
const API_URL = 'https://script.google.com/macros/s/AKfycbxNi3DoFg4ccDyeN2WejUwz1ly25oDThK5vtnNQraRGt9OGdgPwBxbipSfuY6PkLdp6/exec';

// ---- PIN gate ----
const pinOverlay = document.getElementById('pinOverlay');
function getPin() { return localStorage.getItem('vratam_pin') || ''; }
function setPin(p) { localStorage.setItem('vratam_pin', p); }

document.getElementById('pinSubmit').addEventListener('click', () => {
  const val = document.getElementById('pinInput').value.trim();
  if (!val) return;
  setPin(val);
  pinOverlay.classList.add('hidden');
});

if (getPin()) pinOverlay.classList.add('hidden');

// ---- API helpers ----
async function apiGet(params) {
  const url = new URL(API_URL);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  url.searchParams.set('pin', getPin());
  const res = await fetch(url.toString());
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

async function apiPost(body) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...body, pin: getPin() })
  });
  const data = await res.json();
  if (data && data.error) throw new Error(data.error);
  return data;
}

// ---- Toast ----
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(msg, isError) {
  toastEl.textContent = msg;
  toastEl.classList.toggle('error', !!isError);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

// ---- Tabs ----
const tabs = {
  add: { btn: document.getElementById('tab-add'), screen: document.getElementById('screen-add') },
  puja: { btn: document.getElementById('tab-puja'), screen: document.getElementById('screen-puja') },
  list: { btn: document.getElementById('tab-list'), screen: document.getElementById('screen-list') }
};

function showTab(name) {
  Object.entries(tabs).forEach(([key, t]) => {
    t.btn.classList.toggle('active', key === name);
    t.screen.classList.toggle('active', key === name);
  });
  if (name === 'list') {
    showListBrowse();
    if (allMembers.length === 0) loadMembers();
  }
}
tabs.add.btn.addEventListener('click', () => showTab('add'));
tabs.puja.btn.addEventListener('click', () => showTab('puja'));
tabs.list.btn.addEventListener('click', () => showTab('list'));

// ---- Default months = current month ----
function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
document.getElementById('f-startMonth').value = currentMonthStr();
document.getElementById('p-month').value = currentMonthStr();

// ---- Add Entry ----
document.getElementById('btn-add').addEventListener('click', async () => {
  const btn = document.getElementById('btn-add');
  const fullText = document.getElementById('f-fullText').value.trim();
  const gotram = document.getElementById('f-gotram').value.trim();
  if (!fullText || !gotram) { toast('Gotram and Full Text are required', true); return; }

  const payload = {
    action: 'addMember',
    fullText,
    gotram,
    headName: document.getElementById('f-headName').value.trim(),
    phone: document.getElementById('f-phone').value.trim(),
    membershipType: document.getElementById('f-membershipType').value,
    startMonth: document.getElementById('f-startMonth').value,
    amountPaid: document.getElementById('f-amountPaid').value,
    pujaType: document.getElementById('f-pujaType').value
  };

  btn.disabled = true;
  btn.textContent = 'Adding...';
  try {
    const result = await apiPost(payload);
    toast('Added as #' + result.id);
    document.getElementById('f-fullText').value = '';
    document.getElementById('f-gotram').value = '';
    document.getElementById('f-headName').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-amountPaid').value = '';
    document.getElementById('f-membershipType').value = 'One-Time';
    document.getElementById('f-startMonth').value = currentMonthStr();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add Entry';
  }
});

// ---- Execute Puja ----
let pujaQueue = [];
let pujaTotal = 0;
let pujaMonth = '';

const pujaArea = document.getElementById('puja-area');
const pujaProgress = document.getElementById('puja-progress');

document.getElementById('btn-loadPuja').addEventListener('click', loadPuja);

async function loadPuja() {
  pujaMonth = document.getElementById('p-month').value || currentMonthStr();
  pujaArea.innerHTML = '<div class="empty-state">Loading...</div>';
  pujaProgress.classList.add('hidden');
  try {
    const list = await apiGet({ action: 'pending', month: pujaMonth });
    pujaQueue = list;
    pujaTotal = list.length;
    renderPuja();
  } catch (err) {
    pujaArea.innerHTML = '';
    toast(err.message, true);
  }
}

function renderPuja() {
  if (pujaQueue.length === 0) {
    pujaProgress.classList.add('hidden');
    pujaArea.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🎉</div>
        <div>${pujaTotal === 0 ? 'Nothing scheduled for this month.' : 'All done for this month!'}</div>
      </div>`;
    return;
  }

  pujaProgress.classList.remove('hidden');
  const remaining = pujaQueue.length;
  const doneCount = pujaTotal - remaining;
  pujaProgress.textContent = `${doneCount} of ${pujaTotal} completed · ${remaining} remaining`;

  const item = pujaQueue[0];
  pujaArea.innerHTML = `
    <div class="puja-card">
      <div class="puja-number">#${item.id}</div>
      <div class="puja-gotram">${escapeHtml(item.gotram)}</div>
      <div class="puja-text">${escapeHtml(item.text)}</div>
    </div>
    <button class="complete-btn" id="btn-complete">✅ Mark Complete &amp; Next</button>
  `;
  document.getElementById('btn-complete').addEventListener('click', () => completeCurrent(item.id));
}

async function completeCurrent(id) {
  const btn = document.getElementById('btn-complete');
  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    await apiPost({ action: 'complete', id, month: pujaMonth });
    pujaQueue.shift();
    renderPuja();
  } catch (err) {
    toast(err.message, true);
    btn.disabled = false;
    btn.textContent = '✅ Mark Complete & Next';
  }
}

// ---- List / CRUD ----
let allMembers = [];
let editingId = null;

const listBrowse = document.getElementById('list-browse');
const listEdit = document.getElementById('list-edit');
const listRows = document.getElementById('list-rows');
const listSearch = document.getElementById('list-search');
const listMonth = document.getElementById('list-month');
const listCount = document.getElementById('list-count');
let currentFiltered = [];

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleString('en-US', { month: 'long', year: 'numeric' });
}

function showListBrowse() {
  listBrowse.classList.remove('hidden');
  listEdit.classList.add('hidden');
}
function showListEdit() {
  listBrowse.classList.add('hidden');
  listEdit.classList.remove('hidden');
}
document.getElementById('btn-backToList').addEventListener('click', showListBrowse);

document.getElementById('btn-copyList').addEventListener('click', async () => {
  if (currentFiltered.length === 0) { toast('Nothing to copy', true); return; }
  const monthVal = listMonth.value;
  const header = monthVal
    ? `🌟 శ్రీ సత్యనారాయణ వ్రతం - ${monthLabel(monthVal)} జాబితా 🌟\n\n`
    : `🌟 శ్రీ సత్యనారాయణ వ్రతం జాబితా 🌟\n\n`;
  const body = currentFiltered.map((m, i) => `${i + 1}. ${m.text}`).join('\n\n');
  const text = header + body;

  try {
    await navigator.clipboard.writeText(text);
    toast('Copied ' + currentFiltered.length + ' entries — paste into WhatsApp');
  } catch (err) {
    toast('Copy failed: ' + err.message, true);
  }
});

async function loadMembers() {
  listRows.innerHTML = '<div class="empty-state">Loading...</div>';
  try {
    allMembers = await apiGet({ action: 'members' });
    renderList();
  } catch (err) {
    listRows.innerHTML = '';
    toast(err.message, true);
  }
}

listSearch.addEventListener('input', renderList);
listMonth.addEventListener('input', renderList);

function renderList() {
  const q = listSearch.value.trim().toLowerCase();
  const monthVal = listMonth.value;

  const filtered = allMembers.filter(m => {
    if (monthVal) {
      if (m.status !== 'Active') return false;
      const start = m.startMonth ? m.startMonth.slice(0, 7) : null;
      const end = m.endMonth ? m.endMonth.slice(0, 7) : null;
      if (!start || !end || !(start <= monthVal && monthVal <= end)) return false;
    }
    if (!q) return true;
    const hay = [m.id, m.gotram, m.text, m.headName, m.phone].join(' ').toLowerCase();
    return hay.includes(q);
  });

  currentFiltered = filtered;
  listCount.textContent = filtered.length + (monthVal ? ` scheduled for ${monthLabel(monthVal)}` : ' members');

  if (filtered.length === 0) {
    listRows.innerHTML = '<div class="empty-state">No matches.</div>';
    return;
  }

  listRows.innerHTML = filtered.map(m => {
    const badge = m.status === 'Cancelled'
      ? '<span class="badge badge-cancelled">Cancelled</span>'
      : (m.membershipType === 'Annual' ? '<span class="badge badge-annual">Annual</span>' : '<span class="badge badge-onetime">One-Time</span>');
    return `
      <div class="list-row ${m.status === 'Cancelled' ? 'cancelled' : ''}" data-id="${m.id}">
        <div class="list-row-id">#${m.id}</div>
        <div class="list-row-main">
          <div class="list-row-gotram">${escapeHtml(m.gotram)}</div>
          <div class="list-row-text">${escapeHtml(m.text)}</div>
        </div>
        ${badge}
      </div>`;
  }).join('');

  listRows.querySelectorAll('.list-row').forEach(el => {
    el.addEventListener('click', () => openEdit(Number(el.dataset.id)));
  });
}

let deleteConfirming = false;

function openEdit(id) {
  const m = allMembers.find(x => x.id === id);
  if (!m) return;
  editingId = id;
  deleteConfirming = false;

  document.getElementById('e-fullText').value = m.text || '';
  document.getElementById('e-gotram').value = m.gotram || '';
  document.getElementById('e-headName').value = m.headName || '';
  document.getElementById('e-phone').value = m.phone || '';
  document.getElementById('e-membershipType').value = m.membershipType || 'One-Time';
  document.getElementById('e-startMonth').value = m.startMonth ? m.startMonth.slice(0, 7) : currentMonthStr();
  document.getElementById('e-amountPaid').value = m.amountPaid || '';
  document.getElementById('e-pujaType').value = m.pujaType || 'సంకల్ప';
  document.getElementById('e-status').value = m.status || 'Active';

  const delBtn = document.getElementById('btn-delete');
  delBtn.textContent = 'Delete';
  delBtn.classList.remove('confirming');

  loadHistory(m);
  showListEdit();
}

function monthRange(startYm, endYm) {
  const months = [];
  let [y, m] = startYm.split('-').map(Number);
  const [ey, em] = endYm.split('-').map(Number);
  while (y < ey || (y === ey && m <= em)) {
    months.push(`${y}-${String(m).padStart(2, '0')}`);
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return months;
}

async function loadHistory(m) {
  const historyEl = document.getElementById('e-history');
  historyEl.innerHTML = '<div class="history-empty">Loading...</div>';
  if (!m.startMonth || !m.endMonth) {
    historyEl.innerHTML = '<div class="history-empty">No schedule data.</div>';
    return;
  }

  const months = monthRange(m.startMonth.slice(0, 7), m.endMonth.slice(0, 7));
  let completed = [];
  try {
    completed = await apiGet({ action: 'completions', id: m.id });
  } catch (err) {
    historyEl.innerHTML = '<div class="history-empty">Could not load history.</div>';
    return;
  }
  const completedSet = new Set(completed.map(d => d.slice(0, 7)));
  const nowYm = currentMonthStr();

  historyEl.innerHTML = months.map(ym => {
    const done = completedSet.has(ym);
    const right = done
      ? '<span class="history-done">✅ Done</span>'
      : `<span class="history-pending">${ym > nowYm ? 'Upcoming' : 'Pending'}</span>`;
    return `<div class="history-row"><span>${monthLabel(ym)}</span>${right}</div>`;
  }).join('');
}

document.getElementById('btn-save').addEventListener('click', async () => {
  const btn = document.getElementById('btn-save');
  const fullText = document.getElementById('e-fullText').value.trim();
  const gotram = document.getElementById('e-gotram').value.trim();
  if (!fullText || !gotram) { toast('Gotram and Full Text are required', true); return; }

  const payload = {
    action: 'updateMember',
    id: editingId,
    fullText,
    gotram,
    headName: document.getElementById('e-headName').value.trim(),
    phone: document.getElementById('e-phone').value.trim(),
    membershipType: document.getElementById('e-membershipType').value,
    startMonth: document.getElementById('e-startMonth').value,
    amountPaid: document.getElementById('e-amountPaid').value,
    pujaType: document.getElementById('e-pujaType').value,
    status: document.getElementById('e-status').value
  };

  btn.disabled = true;
  btn.textContent = 'Saving...';
  try {
    await apiPost(payload);
    toast('Saved #' + editingId);
    await loadMembers();
    showListBrowse();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Save Changes';
  }
});

document.getElementById('btn-delete').addEventListener('click', async () => {
  const btn = document.getElementById('btn-delete');
  if (!deleteConfirming) {
    deleteConfirming = true;
    btn.textContent = 'Tap again to confirm';
    btn.classList.add('confirming');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Deleting...';
  try {
    await apiPost({ action: 'deleteMember', id: editingId });
    toast('Marked #' + editingId + ' as Cancelled');
    await loadMembers();
    showListBrowse();
  } catch (err) {
    toast(err.message, true);
  } finally {
    btn.disabled = false;
    deleteConfirming = false;
    btn.textContent = 'Delete';
    btn.classList.remove('confirming');
  }
});

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>
